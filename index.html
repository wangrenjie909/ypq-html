<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>热血篮球</title>
    <style>
        body {
            background: linear-gradient(to bottom, #87CEEB, #1e3a8a);
        }
        body::before {
            content: "";
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 320px;
            height: 320px;
            border-radius: 50%;
            background: url('basketball.jpg') center / cover no-repeat;
            z-index: -2;
        }
        .bg-jerseys {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
        }
        .jersey {
            position: absolute;
            width: 90px;
            height: 110px;
            border-radius: 14px 14px 10px 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transform: perspective(600px) rotateX(10deg) rotateZ(4deg);
            box-shadow:
                0 8px 0 rgba(0, 0, 0, 0.35),
                0 14px 20px rgba(0, 0, 0, 0.3);
        }
        .jersey img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .jersey::before {
            content: "";
            position: absolute;
            top: -6px;
            left: 50%;
            transform: translateX(-50%);
            width: 32px;
            height: 16px;
            border-radius: 0 0 50% 50%;
            background: #fff;
        }
        .cavs { background: linear-gradient(180deg, #8f3352, #55202f); top: 20px; left: 20px; }
        .celtics { background: linear-gradient(180deg, #0a8f44, #005a26); top: 20px; right: 20px; }
        .nets { background: linear-gradient(180deg, #2a2a2a, #000); bottom: 20px; left: 20px; }
        .mavericks { background: linear-gradient(180deg, #0a6cb8, #003b66); bottom: 20px; right: 20px; }
        .portal {
            display: inline-block;
            background: #ff6b35;
            color: #fff;
            padding: 6px 14px;
            border-radius: 16px;
            font-size: 14px;
            text-decoration: none;
            font-weight: bold;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        }
        .portal:hover {
            background: #e85a2a;
        }
        .shoe-card {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 16px;
            padding: 18px 16px 10px;
            width: 150px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
        .shoe {
            position: relative;
            width: 130px;
            height: 60px;
            border-radius: 35% 65% 35% 35% / 60% 60% 35% 35%;
            margin: 0 auto;
        }
        .shoe::before {
            content: "";
            position: absolute;
            left: -6px;
            right: -6px;
            bottom: -7px;
            height: 11px;
            background: #1a1a1a;
            border-radius: 8px;
        }
        .shoe::after {
            content: "";
            position: absolute;
            top: 10px;
            left: 10px;
            width: 46px;
            height: 32px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50% 50% 40% 40%;
        }
        .kai1 { background: linear-gradient(180deg, #ffffff, #c9c9c9); }
        .kai2 { background: linear-gradient(180deg, #5aa0e8, #2b6cb8); }
        .kai3 { background: linear-gradient(180deg, #f0653a, #b93a22); }
        .shoe-card p { margin: 14px 0 4px; font-weight: bold; }

        /* ===== 手机端适配：屏幕宽度小于600px时生效 ===== */
        @media (max-width: 600px) {
            h1 { font-size: 1.5em; }
            h3 { font-size: 1.1em; }
            body::before {
                width: 200px;
                height: 200px;
            }
            .jersey {
                width: 55px;
                height: 68px;
            }
            img[src*="kyrie.png"] {
                width: 200px !important;
                height: auto;
            }
            img[src$=".svg"] {
                width: 55px !important;
                margin: 6px 8px;
            }
            img[src*="anta-logo.svg"] {
                width: 90px !important;
            }
            .shoe-card {
                width: 100px !important;
                padding: 10px 6px 6px;
            }
            .shoe-card img {
                width: 92px !important;
                height: auto;
            }
            .shoe-card[style] {
                width: 130px !important;
            }
            .shoe-card[style] img {
                width: 120px !important;
            }
            div[style*="flex"] {
                flex-wrap: wrap;
            }
            .portal {
                padding: 5px 10px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body style="color: white; text-align: center;">
    <div class="bg-jerseys">
        <div class="jersey cavs"><img src="cavs_jersey.jpg" alt="骑士球衣"></div>
        <div class="jersey celtics"><img src="celtics_jersey.jpg" alt="凯尔特人球衣"></div>
        <div class="jersey nets"><img src="nets_jersey.jpg" alt="篮网球衣"></div>
        <div class="jersey mavericks"><img src="mavs_jersey.jpg" alt="独行侠球衣"></div>
    </div>
    <h1>🏀 热血篮球 🏆</h1>
    <p>欢迎来到篮球世界！</p>
    <p>汗水不会说谎。</p>
    <p>我最喜欢的球员是：凯里·欧文！⛹️</p>
    <p>🚪 想看欧文的高光集锦？<a class="portal" href="https://v.qq.com/x/page/n1475c5zzrt.html" target="_blank">点我传送到球场！🎬</a></p>
    <p>欧文球衣号码：11 号！🔢</p>
    <img src="kyrie.png" alt="凯里·欧文" width="300" style="display: block; margin: 0 auto; border-radius: 50%;">
    <p>👟 欧文代言：<img src="anta-logo.svg" alt="安踏" width="120" style="vertical-align: middle;"></p>
    <p>🏀 欧文效力过的球队：骑士 → 凯尔特人 → 篮网 → 独行侠</p>
    <img src="cavaliers.svg" alt="骑士" width="90" style="margin: 10px 15px;">
    <img src="celtics.svg" alt="凯尔特人" width="90" style="margin: 10px 15px;">
    <img src="nets.svg" alt="篮网" width="90" style="margin: 10px 15px;">
    <img src="mavericks.svg" alt="独行侠" width="90" style="margin: 10px 15px;">
    <h3>🏀 我的篮球爱好</h3>
    <ul>
        <li>🏀 练习运球</li>
        <li>⛹️ 模仿欧文的过人</li>
        <li>📺 看篮球比赛</li>
    </ul>
    <h3>🌟 我的篮球小目标</h3>
    <ol>
        <li>练好控球基本功</li>
        <li>学会像欧文一样的过人</li>
        <li>投进人生第一颗三分球</li>
    </ol>
    <h3>👟 欧文的安踏 KAI 签名鞋</h3>
    <div style="display: flex; justify-content: center; gap: 20px;">
        <div class="shoe-card">
            <img src="kai1.jpg" alt="KAI 1" width="150" style="border-radius: 8px;">
            <p>KAI 1</p>
        </div>
        <div class="shoe-card" style="width: 210px;">
            <img src="kai2.jpg" alt="KAI 2" width="200" style="border-radius: 8px;">
            <p>KAI 2</p>
        </div>
        <div class="shoe-card">
            <img src="kai3.jpg" alt="KAI 3" width="150" style="border-radius: 8px;">
            <p>KAI 3</p>
        </div>
    </div>
</body>
</html>
